    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NATO Phonetic Trainer</title>
    <meta name="description" content="Learn and practice the NATO phonetic alphabet for tech support calls. Live">
    <meta name="theme-color" content="#0a0f0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #00ff88;
            --green-dim: #00cc66;
            --green-bg: rgba(0,255,136,0.04);
            --green-bg2: rgba(0,255,136,0.08);
            --green-border: rgba(0,255,136,0.15);
            --green-glow: rgba(0,255,136,0.25);
            --amber: #ffb400;
            --amber-bg: rgba(255,180,0,0.08);
            --amber-border: rgba(255,180,0,0.3);
            --red: #ff4455;
            --red-bg: rgba(255,68,85,0.08);
            --red-border: rgba(255,68,85,0.2);
            --cyan: #00d4ff;
            --bg: #0a0f0c;
            --bg2: rgba(0,0,0,0.25);
            --text: #c8e0d0;
            --text-dim: #667788;
            --text-dimmer: #445566;
            --text-dimmest: #334444;
            --border-dim: rgba(255,255,255,0.06);
            --font: 'Share Tech Mono', 'Courier New', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: linear-gradient(170deg, #0a0f0c 0%, #0d1410 40%, #080d0a 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Scanlines */
        body::after {
            content: '';
            position: fixed; inset: 0;
            pointer-events: none; z-index: 9999;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
        }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.15); border-radius: 3px; }

        .app { max-width: 720px; margin: 0 auto; padding: 28px 16px 40px; }

        /* Header */
        .header { text-align: center; margin-bottom: 32px; }
        .header-sub { font-size: 0.65rem; letter-spacing: 0.35em; color: var(--text-dimmer); margin-bottom: 6px; }
        .header h1 { font-size: 1.7rem; font-weight: 700; color: var(--green); letter-spacing: 0.08em; text-shadow: 0 0 30px var(--green-glow), 0 0 60px rgba(0,255,136,0.08); }
        .header-abc { font-size: 0.72rem; letter-spacing: 0.2em; color: var(--text-dim); margin-top: 5px; }
        .header-meta { color: var(--text-dimmer); font-size: 0.65rem; letter-spacing: 0.08em; margin-top: 9px; }

        /* Stats bar */
        .stats-bar {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
            padding: 10px 16px; background: var(--bg2); border: 1px solid var(--border-dim); border-radius: 2px;
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.6rem; letter-spacing: 0.15em; color: var(--text-dimmer); }
        .stat-val { font-size: 1rem; font-weight: 700; }

        /* Tabs */
        .tabs { display: flex; gap: 6px; margin-bottom: 24px; justify-content: center; flex-wrap: wrap; }
        .tab-btn {
            background: transparent; border: 1px solid var(--border-dim);
            color: var(--text-dim); padding: 9px 14px; font-family: var(--font);
            font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; border-radius: 2px; white-space: nowrap;
        }
        .tab-btn.active { background: rgba(0,255,136,0.1); border-color: var(--green); color: var(--green); }
        .tab-btn:hover:not(.active) { border-color: rgba(0,255,136,0.3); color: #88aa99; }
        .tab-btn:focus-visible, .btn:focus-visible, .quiz-opt:focus-visible, .speak-btn:focus-visible, .input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

        /* Content panel */
        .panel { background: var(--bg2); border: 1px solid rgba(0,255,136,0.06); padding: 22px 18px; border-radius: 2px; }

        /* Inputs */
        .input {
            background: rgba(0,255,136,0.03); border: 1px solid rgba(0,255,136,0.2);
            padding: 12px 14px; color: #e0ffe8; font-family: var(--font);
            font-size: 0.95rem; outline: none; border-radius: 2px; width: 100%;
        }
        .input::placeholder { color: rgba(102,119,136,0.6); }
        .input:focus { border-color: rgba(0,255,136,0.45); }
        textarea.input { resize: vertical; }

        /* Buttons */
        .btn {
            background: var(--green-bg2); border: 1px solid var(--green-border);
            color: var(--green); padding: 10px 20px; font-family: var(--font);
            font-size: 0.82rem; letter-spacing: 0.05em; cursor: pointer;
            border-radius: 2px; transition: all 0.2s; white-space: nowrap;
        }
        .btn:hover { background: rgba(0,255,136,0.15); border-color: var(--green); }
        .btn-amber { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
        .btn-amber:hover { background: rgba(255,180,0,0.15); }
        .btn-dim { background: transparent; border-color: var(--border-dim); color: var(--text-dim); }
        .btn-dim:hover { border-color: rgba(255,255,255,0.15); }
        .btn-red { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }

        /* Grid for reference */
        .ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 7px; }
        .ref-card {
            background: var(--green-bg); border: 1px solid rgba(255,255,255,0.04);
            padding: 12px 10px; display: flex; align-items: baseline; gap: 10px;
            transition: all 0.2s; cursor: pointer; border-radius: 2px;
        }
        .ref-card:hover { background: var(--green-bg2); border-color: var(--green-border); }
        .ref-card .letter { color: var(--green); font-size: 1.25rem; font-weight: 700; width: 22px; text-align: center; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .ref-card .word { color: #99bbaa; font-size: 0.82rem; letter-spacing: 0.03em; }

        /* Quiz options grid */
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 400px; margin: 0 auto; }
        .quiz-opt {
            background: var(--green-bg); border: 1px solid var(--green-border);
            color: #99ccaa; padding: 15px 12px; font-family: var(--font);
            font-size: 0.92rem; font-weight: 600; cursor: pointer;
            transition: all 0.15s; border-radius: 2px; text-align: center;
        }
        .quiz-opt:hover { background: rgba(0,255,136,0.12); }
        .quiz-opt.correct { background: rgba(0,255,136,0.2); border-color: var(--green); color: var(--green); }
        .quiz-opt.wrong { background: rgba(255,68,85,0.15); border-color: var(--red); color: var(--red); }
        .quiz-opt.dimmed { background: rgba(255,255,255,0.01); border-color: rgba(255,255,255,0.03); color: #334455; }

        /* Spell progress dots */
        .spell-chars { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-bottom: 20px; }
        .spell-char {
            width: 36px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 700; border-radius: 2px; transition: all 0.3s;
        }
        .spell-char.done { background: rgba(0,255,136,0.05); border: 1px solid rgba(0,255,136,0.08); color: #336644; }
        .spell-char.active { background: rgba(0,255,136,0.15); border: 1px solid var(--green); color: var(--green); text-shadow: 0 0 12px rgba(0,255,136,0.4); }
        .spell-char.pending { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); color: #334455; }

        /* Results list */
        .result-row {
            display: flex; align-items: center; gap: 10px; padding: 9px 12px;

        .result-row.fail { background: rgba(255,68,85,0.05); border: 1px solid rgba(255,68,85,0.12); }

        /* Converter output */
        .convert-output {
            display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 18px;
            background: rgba(0,255,136,0.02); border: 1px solid rgba(0,255,136,0.08); border-radius: 2px;

        .convert-pair .c-letter { color: var(--green); font-size: 1.05rem; font-weight: 700; text-shadow: 0 0 8px rgba(0,255,136,0.3); }
        .convert-pair .c-word { color: #88aa99; font-size: 0.88rem; margin-left: 5px; }
        .convert-space { width: 100%; height: 6px; }

        /* Call simulator */
        .sim-display {
            text-align: center; padding: 24px; margin-bottom: 20px;
            background: rgba(0,255,136,0.02); border: 1px solid rgba(0,255,136,0.1); border-radius: 2px;
        }
        .sim-label { font-size: 0.7rem; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 10px; }
        .sim-value { font-size: 1.6rem; font-weight: 700; color: var(--green); letter-spacing: 0.12em; text-shadow: 0 0 20px var(--green-glow); word-break: break-all; }
        .sim-timer { font-size: 2.2rem; font-weight: 700; margin: 12px 0; }

        /* Keyboard hints */
        .kbd { display: inline-block; padding: 2px 7px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 3px; font-size: 0.7rem; color: var(--text-dim); margin-left: 4px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #161b22; padding: 10px 20px; border-radius: 4px;
            border-left: 3px solid var(--green); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-size: 0.8rem; z-index: 10000; opacity: 0; transition: all 0.3s;
            pointer-events: none; max-width: 90vw;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Mobile */
        @media (max-width: 600px) {
            .app { padding: 16px 10px 32px; }
            .header h1 { font-size: 1.3rem; }
            .tabs { gap: 4px; }
            .tab-btn { padding: 8px 10px; font-size: 0.7rem; }
            .panel { padding: 16px 12px; }
            .ref-grid { grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 5px; }
            .ref-card { padding: 10px 8px; }

            .quiz-opt { padding: 14px 10px; font-size: 0.85rem; }
            .spell-char { width: 30px; height: 34px; font-size: 1rem; }
            .sim-value { font-size: 1.2rem; }
            .stats-bar { gap: 12px; padding: 8px 10px; }
            .stat-val { font-size: 0.85rem; }
            .settings-grid, .ladder-grid { grid-template-columns: 1fr; }
            .calendar { gap: 3px; }
        }

        /* Fade in */
        .fade-in { animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* Speaker icon button */
        .speak-btn {
            background: none; border: none; color: var(--green); cursor: pointer;
            font-size: 1rem; padding: 4px; opacity: 0.6; transition: opacity 0.2s;
        }
        .speak-btn:hover { opacity: 1; }

        .flex-center { display: flex; justify-content: center; align-items: center; }
        .flex-wrap { display: flex; flex-wrap: wrap; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .mt-12 { margin-top: 12px; }
        .mt-20 { margin-top: 20px; }
        .mt-24 { margin-top: 24px; }
        .mb-12 { margin-bottom: 12px; }
        .mb-20 { margin-bottom: 20px; }
        .mb-24 { margin-bottom: 24px; }
        .text-center { text-align: center; }
        .hidden { display: none !important; }

        /* Preferences, analytics, and new drill surfaces */
        .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 560px; margin: 0 auto; }
        .setting-card, .progress-card { background: var(--green-bg); border: 1px solid var(--border-dim); padding: 14px; border-radius: 2px; }
        .setting-card label { display: block; color: var(--text-dim); font-size: 0.7rem; letter-spacing: 0.08em; margin-bottom: 7px; }
        .setting-card .input { padding: 9px 10px; font-size: 0.82rem; }
        .settings-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

        .heat-cell strong { color: var(--green); font-size: 1rem; }
        .heat-cell small { color: var(--text-dim); font-size: 0.58rem; }
        .calendar { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; max-width: 440px; margin: 0 auto; }
        .calendar-cell { aspect-ratio: 1; min-width: 13px; border: 1px solid var(--border-dim); border-radius: 2px; background: rgba(255,255,255,0.03); }
        .calendar-cell.level-1 { background: rgba(0,255,136,0.16); }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        html[data-theme="contrast"] { --green: #ffffff; --green-dim: #ffffff; --green-bg: rgba(255,255,255,0.12); --green-bg2: rgba(255,255,255,0.2); --green-border: rgba(255,255,255,0.7); --green-glow: rgba(255,255,255,0.3); --amber: #ffe600; --red: #ff7180; --cyan: #7de8ff; --bg: #000000; --bg2: rgba(0,0,0,0.8); --text: #ffffff; --text-dim: #d5d5d5; --text-dimmer: #b7b7b7; --text-dimmest: #929292; --border-dim: rgba(255,255,255,0.25); }

        html[data-font="readable"] body { font-family: Verdana, Arial, sans-serif; }

</head>

<script>
// ═══════════════════════════════════════════════
// NATO DATA
// ═══════════════════════════════════════════════

            O:"Ольга", P:"Павел", Q:"Щука", R:"Роман", S:"Семён", T:"Татьяна", U:"Ульяна",

};

const DIGIT_VARIANTS = {
    standard: {"0":"Zero", "1":"One", "2":"Two", "3":"Three", "4":"Four", "5":"Five", "6":"Six", "7":"Seven", "8":"Eight", "9":"Nine"},
    radio: {"0":"Zero", "1":"One", "2":"Two", "3":"Tree", "4":"Fower", "5":"Fife", "6":"Six", "7":"Seven", "8":"Ait", "9":"Niner"},
    plain: {"0":"Zero", "1":"One", "2":"Two", "3":"Three", "4":"Four", "5":"Five", "6":"Six", "7":"Seven", "8":"Eight", "9":"Nine"}
};

const PREFS_KEY = 'nato_trainer_preferences';
let preferences = { pack: 'icao', digits: 'standard', theme: 'crt', font: 'mono', ttsRate: 0.9, ttsVoice: 'default', whisper: false };
try {
    const savedPreferences = localStorage.getItem(PREFS_KEY);
    if (savedPreferences) preferences = { ...preferences, ...JSON.parse(savedPreferences) };
} catch (e) {}

let activePackId = 'icao';
let activeDigitVariant = 'standard';
let NATO = {};
let LETTERS = [];
let DIGITS = [];
let ALL_KEYS = [];

function updatePackIndicator() {
    const indicator = document.getElementById('pack-indicator');
    if (!indicator) return;
    const pack = PACKS[activePackId];
    const digitLabel = activeDigitVariant === 'radio' ? 'RADIO DIGITS' : activeDigitVariant === 'plain' ? 'PLAIN DIGITS' : 'STANDARD DIGITS';
    indicator.textContent = `${pack.label.toUpperCase()} · ${digitLabel}`;
}

function applyAlphabet(packId = activePackId, digitVariant = activeDigitVariant, announceChange = true) {
    activePackId = PACKS[packId] ? packId : 'icao';
    activeDigitVariant = DIGIT_VARIANTS[digitVariant] ? digitVariant : 'standard';
    NATO = { ...PACKS[activePackId].letters, ...DIGIT_VARIANTS[activeDigitVariant] };
    LETTERS = Object.keys(PACKS[activePackId].letters);
    DIGITS = Object.keys(DIGIT_VARIANTS[activeDigitVariant]);
    ALL_KEYS = [...LETTERS, ...DIGITS];
    updatePackIndicator();
    if (typeof document !== 'undefined' && document.documentElement) document.documentElement.dataset.pack = activePackId;
    if (announceChange && typeof window !== 'undefined' && typeof window.dispatchEvent === 'function') {
        window.dispatchEvent(new CustomEvent('alphabetchange', { detail: { packId: activePackId, digitVariant: activeDigitVariant } }));
    }
}

function savePreferences() {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(preferences)); } catch (e) {}
}

function applyVisualPreferences() {
    if (typeof document === 'undefined' || !document.documentElement) return;
    document.documentElement.dataset.theme = preferences.theme || 'crt';
    document.documentElement.dataset.font = preferences.font || 'mono';
}

applyAlphabet(preferences.pack, preferences.digits, false);
applyVisualPreferences();

// IT-themed samples
const SAMPLES = [
    "SRV-DC01","192.168.1.254","PACS-IMG03","admin@maven","DR-BKUP07",
    "VLAN42","10.0.0.1","HL7-GW02","RIS-PRD01","HTTPS443","DICOM104",
    "FW-EDGE01","VMHost12","AD-SYNC05","NAS-VOL3","ESXi-NODE7",
    "172.16.0.50","SW-CORE02","AP-LOBBY3","WSUS-SRV01","SQL-PRD04",
    "VPN-GW01","DNS-SEC02","RADIUS01","LDAP-DC03","SCCM-PKG1",
    "CERT-CA01","GPO-SEC99","WLC-5520","VEEAM-BK2","STOR-LUN08"
];

function shuffle(a) {
    const b = [...a];
    for (let i = b.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
}

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
}

const OUI_PREFIXES = ['00:1A:2B', '00:25:96', '00:50:56', '3C:52:82', 'B4:2E:99', 'DC:A6:32', 'F0:18:98'];
const IT_HOST_PREFIXES = ['SRV-', 'DC-', 'PACS-', 'NAS-', 'FW-', 'AP-', 'ESXI-', 'SQL-', 'WLC-', 'WSUS-', 'PRINT-', 'VPN-', 'DNS-'];
const IT_HOST_SUFFIXES = ['PRD', 'DEV', 'STG', 'DMZ', 'CORE', 'EDGE', 'NODE', 'BKUP', 'LAB', 'MGMT'];

function randomAlphaNumeric(length) {
    return Array.from({ length }, () => pickRandom([...LETTERS, ...DIGITS])).join('');
}

function generateITString(type = 'hostname') {
    if (type === 'hostname') return pickRandom(IT_HOST_PREFIXES) + pickRandom(IT_HOST_SUFFIXES) + String(Math.floor(Math.random() * 99 + 1)).padStart(2, '0');
    if (type === 'ip') return [10, 172, 192][Math.floor(Math.random() * 3)] + '.' + Math.floor(Math.random() * 256) + '.' + Math.floor(Math.random() * 256) + '.' + Math.floor(Math.random() * 256);
    if (type === 'ipv6') return Array.from({ length: 8 }, () => Math.floor(Math.random() * 65536).toString(16).padStart(4, '0')).join(':');
    if (type === 'serial') return randomAlphaNumeric(4) + '-' + randomAlphaNumeric(6);
    if (type === 'mac') return pickRandom(OUI_PREFIXES) + ':' + Array.from({ length: 3 }, () => Math.floor(Math.random() * 256).toString(16).toUpperCase().padStart(2, '0')).join(':');
    if (type === 'license') return Array.from({ length: 5 }, () => randomAlphaNumeric(5)).join('-');
    if (type === 'mixed') return generateITString(pickRandom(['hostname', 'ip', 'ipv6', 'serial', 'mac', 'license']));
    return generateITString('hostname');
}

// ═══════════════════════════════════════════════
// SOUND EFFECTS (Web Audio API)
// ═══════════════════════════════════════════════
let audioCtx = null;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playCorrect() {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
}

function playWrong() {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

function playTick() {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.05);
    } catch(e) {}
}

function playComplete() {
    try {
        const ctx = getAudio();
        [0, 0.12, 0.24, 0.36].forEach((t, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime([523, 659, 784, 1047][i], ctx.currentTime + t);
            gain.gain.setValueAtTime(0.1, ctx.currentTime + t);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
            osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + 0.2);
        });
    } catch(e) {}
}

// ═══════════════════════════════════════════════
// TEXT-TO-SPEECH
// ═══════════════════════════════════════════════
function playWhisperNoise(duration = 1.4) {
    try {
        const ctx = getAudio();
        const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let last = 0;
        for (let i = 0; i < length; i++) {
            last = (last * 0.96) + ((Math.random() * 2 - 1) * 0.04);
            data[i] = last * 5;
        }
        const source = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();
        source.buffer = buffer;
        filter.type = 'bandpass';
        filter.frequency.value = 1200;
        filter.Q.value = 0.7;
        gain.gain.setValueAtTime(0.025, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        source.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        source.start(); source.stop(ctx.currentTime + duration);
    } catch (e) {}
}

function availableVoices() {
    return 'speechSynthesis' in window && typeof window.speechSynthesis.getVoices === 'function' ? window.speechSynthesis.getVoices() : [];
}

function speak(text, options = {}) {
    if (!('speechSynthesis' in window)) { announce('Text to speech is not available in this browser'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = Number(options.rate || preferences.ttsRate || 0.9);
    u.pitch = 1;
    u.volume = preferences.whisper || options.whisper ? 0.65 : 1;
    const voice = availableVoices().find(item => item.voiceURI === preferences.ttsVoice);
    if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
    if (preferences.whisper || options.whisper) playWhisperNoise(Math.max(1, text.length * 0.07));
}

function speakerIcon() { return '🔊'; }

// PERSISTENT STATS (localStorage)
// ═══════════════════════════════════════════════
const STORE_KEY = 'nato_trainer_stats';
function freshStats() {
    return {
        version: 2,
        sessions: 0,
        totalCorrect: 0,
        totalAttempts: 0,
        bestStreak: 0,
        bestTimedScore: 0,
        letterStats: {},
        confusions: {},
        activityDays: {},
        sessionHistory: [],
        leaderboard: [],
        ladderUnlocked: 1
    };
}
let stats = freshStats();

function normalizeStats(raw) {
    const base = freshStats();
    const merged = { ...base, ...(raw || {}) };
    merged.letterStats = raw?.letterStats && typeof raw.letterStats === 'object' ? raw.letterStats : {};
    merged.confusions = raw?.confusions && typeof raw.confusions === 'object' ? raw.confusions : {};
    merged.activityDays = raw?.activityDays && typeof raw.activityDays === 'object' ? raw.activityDays : {};
    merged.sessionHistory = Array.isArray(raw?.sessionHistory) ? raw.sessionHistory.slice(-100) : [];
    merged.leaderboard = Array.isArray(raw?.leaderboard) ? raw.leaderboard.slice(-20) : [];
    return merged;
}

function loadStats() {
    try {
        const s = localStorage.getItem(STORE_KEY);
        if (s) stats = normalizeStats(JSON.parse(s));
    } catch(e) {}
    renderStats();
    if (typeof window !== 'undefined' && typeof window.dispatchEvent === 'function') window.dispatchEvent(new Event('statschange'));
}

function saveStats() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stats)); } catch(e) {}
    renderStats();
    if (typeof window !== 'undefined' && typeof window.dispatchEvent === 'function') window.dispatchEvent(new Event('statschange'));
}

function renderStats() {
    document.getElementById('stat-sessions').textContent = stats.sessions;
    document.getElementById('stat-accuracy').textContent = stats.totalAttempts > 0 ? Math.round(stats.totalCorrect / stats.totalAttempts * 100) + '%' : '—';
    document.getElementById('stat-streak').textContent = stats.bestStreak;
    document.getElementById('stat-besttime').textContent = stats.bestTimedScore > 0 ? stats.bestTimedScore : '—';
}

function dayKey(date = new Date()) { return date.toISOString().slice(0, 10); }

function startSession() {
    stats.sessions++;
    saveStats();
}

function recordAnswer(key, given, correct, mode = 'practice') {
    const answerKey = String(key || '?').toUpperCase();
    const answer = String(given || '').trim();
    const bucket = stats.letterStats[answerKey] || { attempts: 0, correct: 0 };
    bucket.attempts++;
    if (correct) bucket.correct++;
    stats.letterStats[answerKey] = bucket;
    stats.totalAttempts++;
    if (correct) stats.totalCorrect++;

    if (!correct) {
        const confusionKey = `${answerKey}|${answer || '?'}`;
        stats.confusions[confusionKey] = (stats.confusions[confusionKey] || 0) + 1;
    }

    const day = dayKey();
    const activity = stats.activityDays[day] || { attempts: 0, correct: 0 };
    activity.attempts++;
    if (correct) activity.correct++;
    stats.activityDays[day] = activity;
    stats.lastMode = mode;
    saveStats();
    announce(`${correct ? 'Correct' : 'Incorrect'} ${answerKey}${answer ? `, answer ${answer}` : ''}`);
}

function recordSession(kind, score, total, duration = 0) {
    stats.sessionHistory.push({ date: new Date().toISOString(), kind, score, total, duration });
    stats.sessionHistory = stats.sessionHistory.slice(-100);
    stats.leaderboard.push({ date: new Date().toISOString(), kind, score, total });
    stats.leaderboard = stats.leaderboard.sort((a, b) => b.score - a.score).slice(0, 20);
    saveStats();
}

function masteryEstimate() {
    const keys = LETTERS;
    const mastered = keys.filter(key => {
        const item = stats.letterStats[key];
        return item && item.attempts >= 3 && item.correct / item.attempts >= 0.9;
    }).length;
    const weak = keys.filter(key => !stats.letterStats[key] || (stats.letterStats[key].correct / Math.max(1, stats.letterStats[key].attempts)) < 0.9);
    const estimatedAttempts = weak.reduce((sum, key) => {
        const item = stats.letterStats[key];
        if (!item) return sum + 5;
        return sum + Math.max(1, Math.ceil((item.attempts * 0.9 - item.correct) / 0.75));
    }, 0);
    return { mastered, total: keys.length, estimatedAttempts };
}

function confusionCsv() {
    const rows = [['Expected', 'Given', 'Count']];
    Object.entries(stats.confusions).sort((a, b) => b[1] - a[1]).forEach(([pair, count]) => {
        const split = pair.indexOf('|');
        rows.push([pair.slice(0, split), pair.slice(split + 1), count]);
    });
    return rows.map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(',')).join('\n');
}

function downloadText(filename, content, type = 'text/plain') {
    const blob = new Blob([content], { type });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 0);
}

            document.getElementById('spell-random').addEventListener('click', () => startSpell(pickRandom(SAMPLES)));
        } else if (state.mode === 'active') {
            const charsHtml = state.chars.map((c, i) => {
                const cls = i < state.idx ? 'done' : i === state.idx ? 'active' : 'pending';
                return `<span class="spell-char ${cls}">${c}</span>`;
            }).join('');

            el.innerHTML = `
                <div class="text-center" style="padding:15px 0">
                    <div style="color:var(--text-dim);font-size:0.7rem;letter-spacing:0.15em;margin-bottom:10px">SPELLING OUT</div>

                    <div style="font-size:3rem;font-weight:700;color:var(--green);text-shadow:0 0 30px var(--green-glow);margin-bottom:6px">${state.chars[state.idx]}</div>
                    <div style="color:var(--text-dim);font-size:0.78rem;letter-spacing:0.1em;margin-bottom:18px">CHARACTER ${state.idx + 1} OF ${state.chars.length}</div>
                    <div class="flex-center gap-12">
                        <input class="input" id="spell-input" placeholder="Type phonetic word..." style="width:240px;flex:none;text-align:center;font-size:1.05rem" autocomplete="off">
                        <button class="btn" id="spell-submit">SUBMIT</button>
                    </div>
                    <div style="color:var(--text-dimmest);font-size:0.68rem;margin-top:10px">Press Enter to submit</div>
                </div>
            `;
            const inp = document.getElementById('spell-input');
            setTimeout(() => inp.focus(), 50);
            inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) submitSpell(); });
            document.getElementById('spell-submit').addEventListener('click', () => { if (inp.value.trim()) submitSpell(); });
        } else if (state.mode === 'results') {
            const score = state.results.filter(r => r.correct).length;
            const total = state.results.length;
            const pct = Math.round(score / total * 100);
            const color = pct === 100 ? 'var(--green)' : pct >= 70 ? 'var(--amber)' : 'var(--red)';
            const msg = pct === 100 ? 'PERFECT TRANSMISSION' : pct >= 70 ? 'GOOD COPY' : 'NEEDS PRACTICE';

            let rows = state.results.map(r => `
                <div class="result-row ${r.correct ? 'ok' : 'fail'}">
                    <span style="color:var(--green);font-weight:700;width:26px;text-align:center">${r.char}</span>
                    <span style="color:${r.correct ? 'var(--green)' : 'var(--red)'};flex:1">${r.given || '(empty)'}</span>
                    ${r.correct ? '' : `<span style="color:var(--text-dim)">→ ${r.expected}</span>`}
                    <span>${r.correct ? '✓' : '✗'}</span>
                </div>
            `).join('');

                    <div style="color:var(--text-dim);font-size:0.78rem;letter-spacing:0.1em">${msg}</div>
                </div>
                <div style="max-width:480px;margin:0 auto">${rows}</div>
                <div class="flex-center gap-12 mt-24">
                    <button class="btn" id="spell-retry">RETRY</button>
                    <button class="btn btn-dim" id="spell-new">NEW</button>
                    <button class="speak-btn" id="spell-speak" title="Hear correct answer">${speakerIcon()}</button>
                </div>
            `;
            document.getElementById('spell-retry').addEventListener('click', () => startSpell(state.challenge));
            document.getElementById('spell-new').addEventListener('click', () => { state.mode = 'setup'; render(); });
            document.getElementById('spell-speak').addEventListener('click', () => {
                speak(state.chars.map(c => NATO[c]).join(', '));
            });
        }
    }

    function startSpell(text) {
        const upper = text.toUpperCase();
        const chars = upper.split('').filter(c => NATO[c]);
        state = { mode: 'active', challenge: upper, chars, answers: chars.map(c => NATO[c]), idx: 0, results: [] };
        startSession();
        render();
    }

    function submitSpell() {
        const inp = document.getElementById('spell-input');
        const given = inp.value.trim();
        const expected = state.answers[state.idx];
        const correct = given.toLowerCase() === expected.toLowerCase();

        if (correct) playCorrect(); else playWrong();
        recordAnswer(state.chars[state.idx], given, correct, 'spell');

        state.results.push({ char: state.chars[state.idx], expected, given, correct });
        state.idx++;
        if (state.idx >= state.chars.length) {
            state.mode = 'results';
            playComplete();
        }
        render();
    }

    render();
})();

            <div class="text-center" style="font-size:${displaySize};font-weight:700;color:var(--green);text-shadow:0 0 30px var(--green-glow);min-height:70px;display:flex;align-items:center;justify-content:center;margin-bottom:24px">${qState.current}</div>
            <div class="quiz-grid">${optsHtml}</div>
            <div class="flex-center mt-24">
                <button class="btn btn-dim" id="quiz-back">BACK</button>
            </div>
        `;

        el.querySelectorAll('.quiz-opt').forEach(b => b.addEventListener('click', () => handleQuizPick(b.dataset.opt)));
        document.getElementById('quiz-back').addEventListener('click', () => { qState.running = false; render(); });
    }

    function startQuiz(type) {
        qState = { running: true, type, current: null, options: [], selected: null, score: 0, total: 0, streak: 0, best: 0 };
        startSession();
        nextQuestion();
    }

    function nextQuestion() {
        const key = pickRandom(ALL_KEYS);
        const correct = NATO[key];
        if (qState.type === 'word') {
            qState.current = correct;
            qState.options = shuffle([key, ...shuffle(ALL_KEYS.filter(k => k !== key)).slice(0, 3)]);
        } else {
            qState.current = key;
            const wrongs = shuffle(Object.values(NATO).filter(v => v !== correct)).slice(0, 3);
            qState.options = shuffle([correct, ...wrongs]);
        }
        qState.selected = null;
        render();
    }

    function handleQuizPick(opt) {
        if (qState.selected !== null) return;
        qState.selected = opt;
        const isCorrect = qState.type === 'word' ? NATO[opt] === qState.current : opt === NATO[qState.current];

        if (isCorrect) { playCorrect(); qState.score++; qState.streak++; qState.best = Math.max(qState.best, qState.streak); }
        else { playWrong(); qState.streak = 0; }
        qState.total++;

        const quizKey = qState.type === 'word' ? opt : qState.current;
        recordAnswer(quizKey, opt, isCorrect, 'quiz');
        if (qState.best > stats.bestStreak) stats.bestStreak = qState.best;
        saveStats();

        render();
        setTimeout(nextQuestion, isCorrect ? 400 : 1100);
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
        if (activeTab !== 'quiz' || !qState.running || qState.selected !== null) return;
        const idx = parseInt(e.key) - 1;
        if (idx >= 0 && idx < qState.options.length) {
            handleQuizPick(qState.options[idx]);
        }
    });

    render();
})();

        } else if (sState.mode === 'results') {
            const score = sState.results.filter(r => r.correct).length;
            const total = sState.results.length;
            const elapsed = ((Date.now() - sState.startTime) / 1000).toFixed(1);
            const pct = Math.round(score / total * 100);
            const color = pct === 100 ? 'var(--green)' : pct >= 70 ? 'var(--amber)' : 'var(--red)';

            let rows = sState.results.map(r => `
                <div class="result-row ${r.correct ? 'ok' : 'fail'}">
                    <span style="color:var(--green);font-weight:700;width:26px;text-align:center">${r.char}</span>

                </div>
            `;

            document.getElementById('sim-back').addEventListener('click', () => { sState.mode = 'setup'; render(); });
            document.getElementById('sim-speak').addEventListener('click', () => {
                speak(sState.chars.map(c => NATO[c]).join(', '));
            });
        }
    }

    function startSim() {
        const value = TYPES[sState.type]();
        const chars = value.toUpperCase().split('').filter(c => NATO[c]);
        sState = { ...sState, mode: 'active', value: value.toUpperCase(), chars, answers: chars.map(c => NATO[c]), idx: 0, results: [], startTime: Date.now() };
        startSession();
        render();
    }

    function submitSim() {
        const inp = document.getElementById('sim-input');
        const given = inp.value.trim();
        const expected = sState.answers[sState.idx];
        const correct = given.toLowerCase() === expected.toLowerCase();

        if (correct) playCorrect(); else playWrong();
        recordAnswer(sState.chars[sState.idx], given, correct, 'sim');

        sState.results.push({ char: sState.chars[sState.idx], expected, given, correct });
        sState.idx++;
        if (sState.idx >= sState.chars.length) {
            sState.mode = 'results';
            playComplete();
        }
        render();
    }

    render();
})();

        tState.timer = setInterval(() => {
            tState.timeLeft--;
            if (tState.timeLeft <= 10) playTick();

    function nextTimedQ() {
        const key = pickRandom(ALL_KEYS);

        tState.options = shuffle([correct, ...wrongs]);
        tState.selected = null;
        render();

    function handleTimedPick(opt) {
        if (tState.selected !== null || tState.timeLeft <= 0) return;

        if (activeTab !== 'timed' || !tState.running || tState.selected !== null || tState.timeLeft <= 0) return;

        if (idx >= 0 && idx < tState.options.length) {
            handleTimedPick(tState.options[idx]);
        }
    });

    render();
})();

// 8. SPEED-RAMP DRILL
// ═══════════════════════════════════════════════
(function initRamp() {
    const el = document.getElementById('panel-ramp');
    let state = { running: false, current: null, options: [], selected: null, score: 0, total: 0, streak: 0, limit: 4200, deadline: 0, timer: null };

    function render() {
        if (!state.running) {
            el.innerHTML = `
                <div class="text-center" style="padding:34px 0">
                    <div style="color:var(--text-dim);font-size:0.82rem;letter-spacing:0.1em;margin-bottom:8px">SPEED-RAMP DRILL</div>
                    <div style="color:var(--text-dimmer);font-size:0.75rem;line-height:1.5;max-width:420px;margin:0 auto 22px">Each correct answer shortens the response window. A wrong answer resets the clock to the starting pace.</div>
                    <button class="btn btn-amber" id="ramp-start" style="padding:14px 32px">START RAMP</button>
                </div>`;
            document.getElementById('ramp-start').addEventListener('click', start);
            return;
        }
        const remaining = Math.max(0, state.deadline - Date.now());
        const pct = Math.min(100, remaining / state.limit * 100);
        const optsHtml = state.options.map((option, i) => {
            let cls = '';
            if (state.selected !== null) cls = option === NATO[state.current] ? 'correct' : option === state.selected ? 'wrong' : 'dimmed';
            return `<button type="button" class="quiz-opt ${cls}" data-ramp-opt="${escapeHtml(option)}"><span class="kbd">${i + 1}</span> ${escapeHtml(option)}</button>`;
        }).join('');
        el.innerHTML = `
            <div class="flex-center gap-12 mb-20" style="gap:28px">
                <div class="text-center"><div class="stat-label">SCORE</div><div class="stat-val" style="color:var(--green)">${state.score}/${state.total}</div></div>
                <div class="text-center"><div class="stat-label">STREAK</div><div class="stat-val" style="color:var(--amber)">${state.streak}</div></div>
                <div class="text-center"><div class="stat-label">WINDOW</div><div class="stat-val" style="color:var(--cyan)">${(state.limit / 1000).toFixed(1)}s</div></div>
            </div>
            <div class="ramp-bar" aria-label="Response time remaining"><span style="width:${pct}%"></span></div>
            <div class="text-center" style="font-size:3.8rem;font-weight:700;color:var(--green);text-shadow:0 0 30px var(--green-glow);min-height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:24px">${state.current}</div>
            <div class="quiz-grid">${optsHtml}</div>
            <div class="flex-center mt-24"><button type="button" class="btn btn-dim" id="ramp-stop">STOP</button></div>`;
        el.querySelectorAll('[data-ramp-opt]').forEach(button => button.addEventListener('click', () => answer(button.dataset.rampOpt)));
        document.getElementById('ramp-stop').addEventListener('click', stop);
    }

    function start() {
        clearInterval(state.timer);
        state = { running: true, current: null, options: [], selected: null, score: 0, total: 0, streak: 0, limit: 4200, deadline: 0, timer: null };
        startSession();
        next();
        state.timer = setInterval(() => {
            if (Date.now() >= state.deadline) {
                state.selected = '__timeout__';
                state.streak = 0;
                state.total++;
                recordAnswer(state.current, '', false, 'ramp');
                playWrong();
                next();
            } else render();
        }, 100);
    }

    function next() {
        const key = pickRandom(ALL_KEYS);
        const correct = NATO[key];
        state.current = key;
        state.options = shuffle([correct, ...shuffle(Object.values(NATO).filter(word => word !== correct)).slice(0, 3)]);
        state.selected = null;
        state.deadline = Date.now() + state.limit;
        render();
    }

    function answer(option) {
        if (state.selected !== null || !state.running) return;
        state.selected = option;
        const correct = option === NATO[state.current];
        state.total++;
        if (correct) { state.score++; state.streak++; state.limit = Math.max(900, state.limit - 180); playCorrect(); }
        else { state.streak = 0; state.limit = 4200; playWrong(); }
        recordAnswer(state.current, option, correct, 'ramp');
        render();
        setTimeout(next, correct ? 280 : 850);
    }

    function stop() { clearInterval(state.timer); state.running = false; render(); }
    window.addEventListener('tabchange', event => { if (event.detail.tab !== 'ramp' && state.running) stop(); });
    render();
})();

// ═══════════════════════════════════════════════
// 9. CHALLENGE LADDER
// ═══════════════════════════════════════════════
(function initLadder() {
    const el = document.getElementById('panel-ladder');
    const tiers = [
        { kind: 'hostname', label: 'HOSTNAME', detail: 'Short IT hostnames' },
        { kind: 'ip', label: 'IPv4', detail: 'Dotted decimal addresses' },
        { kind: 'mac', label: 'MAC', detail: 'Vendor-prefixed hex pairs' },
        { kind: 'serial', label: 'SERIAL', detail: 'Long alphanumeric IDs' },
        { kind: 'license', label: 'LICENSE', detail: 'Five groups of five' }
    ];
    let state = { mode: 'setup', tier: 0, value: '', chars: [], answers: [], idx: 0, results: [] };

    function render() {
        const unlocked = Math.min(tiers.length, Math.max(1, stats.ladderUnlocked || 1));
        if (state.mode === 'setup') {
            el.innerHTML = `
                <div class="text-center" style="padding:24px 0">
                    <div style="color:var(--text-dim);font-size:0.82rem;letter-spacing:0.1em;margin-bottom:8px">CHALLENGE LADDER</div>
                    <div style="color:var(--text-dimmer);font-size:0.75rem;margin-bottom:20px">Clear each tier at 80% or better to unlock the next format.</div>
                    <div class="ladder-grid">${tiers.map((tier, index) => `<button type="button" class="ladder-tier ${index < unlocked ? 'unlocked' : ''} ${index === state.tier ? 'active' : ''}" data-ladder-tier="${index}" ${index >= unlocked ? 'disabled' : ''}><strong>${index + 1}. ${tier.label}</strong><small>${tier.detail}${index >= unlocked ? ' · LOCKED' : ''}</small></button>`).join('')}</div>
                    <button type="button" class="btn btn-amber" id="ladder-start" style="padding:13px 30px">CLIMB TIER ${state.tier + 1}</button>
                </div>`;
            el.querySelectorAll('[data-ladder-tier]').forEach(button => button.addEventListener('click', () => { state.tier = Number(button.dataset.ladderTier); render(); }));
            document.getElementById('ladder-start').addEventListener('click', start);
            return;
        }

        const score = state.results.filter(item => item.correct).length;
        if (state.mode === 'results') {
            const pct = Math.round(score / state.results.length * 100);
            const unlockedNow = pct >= 80 && state.tier + 1 >= (stats.ladderUnlocked || 1);
            if (unlockedNow) { stats.ladderUnlocked = Math.min(tiers.length, state.tier + 2); saveStats(); }
            const rows = state.results.map(item => `<div class="result-row ${item.correct ? 'ok' : 'fail'}"><span style="color:var(--green);font-weight:700;width:28px;text-align:center">${item.char}</span><span style="flex:1;color:${item.correct ? 'var(--green)' : 'var(--red)'}">${escapeHtml(item.given || '(empty)')}</span>${item.correct ? '' : `<span style="color:var(--text-dim)">→ ${escapeHtml(item.expected)}</span>`}<span>${item.correct ? '✓' : '✗'}</span></div>`).join('');
            el.innerHTML = `<div class="text-center mb-20"><div style="font-size:2.5rem;font-weight:700;color:${pct >= 80 ? 'var(--green)' : 'var(--red)'}">${score}/${state.results.length}</div><div style="color:var(--text-dim);font-size:0.78rem;letter-spacing:0.1em">${pct >= 80 ? (unlockedNow ? 'NEXT TIER UNLOCKED' : 'TIER CLEARED') : 'REPEAT THIS TIER'}</div></div><div style="max-width:480px;margin:0 auto">${rows}</div><div class="flex-center gap-12 mt-24"><button type="button" class="btn" id="ladder-retry">RETRY</button><button type="button" class="btn btn-dim" id="ladder-back">LADDER</button></div>`;
            document.getElementById('ladder-retry').addEventListener('click', start);
            document.getElementById('ladder-back').addEventListener('click', () => { state.mode = 'setup'; render(); });
            return;
        }

        const charsHtml = state.chars.map((char, index) => `<span class="spell-char ${index < state.idx ? 'done' : index === state.idx ? 'active' : 'pending'}">${char}</span>`).join('');
        el.innerHTML = `<div class="text-center" style="padding:12px 0"><div style="color:var(--text-dim);font-size:0.7rem;letter-spacing:0.15em;margin-bottom:10px">TIER ${state.tier + 1} · ${tiers[state.tier].label}</div><div class="sim-display"><div class="sim-label">READ THIS STRING</div><div class="sim-value">${state.value}</div></div><div class="spell-chars">${charsHtml}</div><div style="font-size:2.7rem;font-weight:700;color:var(--green);margin-bottom:6px">${state.chars[state.idx]}</div><div style="color:var(--text-dim);font-size:0.75rem;margin-bottom:18px">CHARACTER ${state.idx + 1} OF ${state.chars.length}</div><div class="flex-center gap-12"><input class="input" id="ladder-input" placeholder="Phonetic word..." style="width:240px;flex:none;text-align:center" autocomplete="off"><button type="button" class="btn" id="ladder-submit">SUBMIT</button></div></div>`;
        const input = document.getElementById('ladder-input');
        setTimeout(() => input.focus(), 20);
        input.addEventListener('keydown', event => { if (event.key === 'Enter' && input.value.trim()) submit(); });
        document.getElementById('ladder-submit').addEventListener('click', () => { if (input.value.trim()) submit(); });
    }

    function start() {
        const value = generateITString(tiers[state.tier].kind).toUpperCase();
        const chars = value.split('').filter(char => NATO[char]);
        state = { mode: 'active', tier: state.tier, value, chars, answers: chars.map(char => NATO[char]), idx: 0, results: [] };
        startSession();
        render();
    }

    function submit() {
        const input = document.getElementById('ladder-input');
        const given = input.value.trim();
        const expected = state.answers[state.idx];
        const correct = given.toLowerCase() === expected.toLowerCase();
        if (correct) playCorrect(); else playWrong();
        recordAnswer(state.chars[state.idx], given, correct, 'ladder');
        state.results.push({ char: state.chars[state.idx], expected, given, correct });
        state.idx++;
        if (state.idx >= state.chars.length) { state.mode = 'results'; playComplete(); recordSession('ladder-' + tiers[state.tier].kind, state.results.filter(item => item.correct).length, state.results.length); }
        render();
    }

    render();
})();

// ═══════════════════════════════════════════════
// 10. PROGRESS ANALYTICS
// ═══════════════════════════════════════════════
(function initProgress() {
    const el = document.getElementById('panel-progress');
    function render() {
        const estimate = masteryEstimate();
        const heat = LETTERS.map(key => {
            const item = stats.letterStats[key] || { attempts: 0, correct: 0 };
            const accuracy = item.attempts ? item.correct / item.attempts : 0;
            const background = item.attempts ? `rgba(0,255,136,${0.08 + accuracy * 0.5})` : 'rgba(255,255,255,0.03)';
            return `<div class="heat-cell" style="background:${background}" title="${key}: ${item.correct}/${item.attempts}"><strong>${key}</strong><small>${item.attempts ? Math.round(accuracy * 100) + '%' : '—'}</small></div>`;
        }).join('');
        const calendar = Array.from({ length: 28 }, (_, offset) => {
            const date = new Date();
            date.setDate(date.getDate() - (27 - offset));
            const activity = stats.activityDays[dayKey(date)] || { attempts: 0, correct: 0 };
            const level = activity.attempts === 0 ? 0 : activity.attempts < 3 ? 1 : activity.attempts < 8 ? 2 : activity.attempts < 15 ? 3 : 4;
            return `<div class="calendar-cell level-${level}" title="${dayKey(date)} · ${activity.correct}/${activity.attempts}"></div>`;
        }).join('');
        const confusionRows = Object.entries(stats.confusions).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([pair, count]) => {
            const split = pair.indexOf('|');
            return `<div class="result-row fail"><span style="color:var(--red);font-weight:700;width:70px">${escapeHtml(pair.slice(0, split))}</span><span style="flex:1">${escapeHtml(pair.slice(split + 1))}</span><span>${count}</span></div>`;
        }).join('') || '<p>No incorrect answers recorded yet.</p>';
        const leaderboardRows = stats.leaderboard.slice(0, 8).map(item => `<div class="result-row ok"><span style="flex:1">${escapeHtml(item.kind)}</span><span style="color:var(--green);font-weight:700">${item.score}/${item.total}</span></div>`).join('') || '<p>Complete a drill to start your local leaderboard.</p>';
        el.innerHTML = `
            <div class="progress-stack">
                <div class="progress-card"><h3>MASTERY ESTIMATE</h3><p><strong style="color:var(--green);font-size:1.2rem">${estimate.mastered}/${estimate.total}</strong> letters at 90%+ accuracy. Estimated practice remaining: <strong style="color:var(--amber)">${estimate.estimatedAttempts}</strong> attempts.</p></div>
                <div class="progress-card"><h3>PER-LETTER ACCURACY</h3><div class="heatmap">${heat}</div></div>
                <div class="progress-card"><h3>28-DAY ACTIVITY</h3><div class="calendar">${calendar}</div><p style="text-align:center;margin-top:8px">Brighter cells indicate more attempts.</p></div>
                <div class="progress-card"><h3>TOP CONFUSIONS</h3><div class="progress-list">${confusionRows}</div></div>
                <div class="progress-card"><h3>LOCAL LEADERBOARD</h3><div class="progress-list">${leaderboardRows}</div></div>
                <div class="settings-actions"><button type="button" class="btn" id="export-csv">EXPORT CONFUSION CSV</button><button type="button" class="btn btn-dim" id="export-json">EXPORT PROGRESS JSON</button></div>
            </div>`;
        document.getElementById('export-csv').addEventListener('click', () => { downloadText('nato-confusions.csv', confusionCsv(), 'text/csv'); showToast('Confusion CSV exported'); });
        document.getElementById('export-json').addEventListener('click', () => { downloadText('nato-progress.json', JSON.stringify(stats, null, 2), 'application/json'); showToast('Progress JSON exported'); });
    }
    window.addEventListener('statschange', render);
    window.addEventListener('alphabetchange', render);
    render();
})();

// ═══════════════════════════════════════════════
// 11. SETTINGS AND ACCESSIBILITY
// ═══════════════════════════════════════════════
(function initSettings() {
    const el = document.getElementById('panel-settings');
    function render() {
        const voices = availableVoices();
        const packOptions = Object.entries(PACKS).map(([id, pack]) => `<option value="${id}" ${id === activePackId ? 'selected' : ''}>${escapeHtml(pack.label)}</option>`).join('');
        const voiceOptions = `<option value="default">Browser default</option>` + voices.map(voice => `<option value="${escapeHtml(voice.voiceURI)}" ${voice.voiceURI === preferences.ttsVoice ? 'selected' : ''}>${escapeHtml(voice.name)} (${escapeHtml(voice.lang)})</option>`).join('');
        el.innerHTML = `
            <div class="text-center" style="padding:10px 0 20px"><div style="color:var(--text-dim);font-size:0.82rem;letter-spacing:0.1em">TRAINER SETTINGS</div><div style="color:var(--text-dimmer);font-size:0.75rem;margin-top:6px">Preferences stay on this device and work offline.</div></div>
            <div class="settings-grid">
                <div class="setting-card"><label for="setting-pack">ALPHABET PACK</label><select class="input" id="setting-pack">${packOptions}</select></div>
                <div class="setting-card"><label for="setting-digits">DIGIT PRONUNCIATION</label><select class="input" id="setting-digits"><option value="standard" ${preferences.digits === 'standard' ? 'selected' : ''}>Standard · Five / Nine</option><option value="radio" ${preferences.digits === 'radio' ? 'selected' : ''}>Radio · Fife / Niner</option><option value="plain" ${preferences.digits === 'plain' ? 'selected' : ''}>Plain · Five / Nine</option></select></div>
                <div class="setting-card"><label for="setting-theme">VISUAL THEME</label><select class="input" id="setting-theme"><option value="crt" ${preferences.theme === 'crt' ? 'selected' : ''}>CRT green</option><option value="amber" ${preferences.theme === 'amber' ? 'selected' : ''}>Amber terminal</option><option value="contrast" ${preferences.theme === 'contrast' ? 'selected' : ''}>High contrast</option></select></div>
                <div class="setting-card"><label for="setting-font">TYPEFACE</label><select class="input" id="setting-font"><option value="mono" ${preferences.font === 'mono' ? 'selected' : ''}>Terminal mono</option><option value="readable" ${preferences.font === 'readable' ? 'selected' : ''}>Readable sans</option></select></div>
                <div class="setting-card"><label for="setting-rate">TTS RATE · <span id="setting-rate-value">${Number(preferences.ttsRate).toFixed(1)}×</span></label><input class="input" id="setting-rate" type="range" min="0.5" max="1.4" step="0.1" value="${preferences.ttsRate}"></div>
                <div class="setting-card"><label for="setting-voice">TTS VOICE</label><select class="input" id="setting-voice">${voiceOptions}</select></div>
                <div class="setting-card"><label for="setting-whisper">PHONE AUDIO</label><label style="display:flex;align-items:center;gap:8px;color:var(--text)"><input id="setting-whisper" type="checkbox" ${preferences.whisper ? 'checked' : ''}> Add filtered noise during TTS</label></div>
            </div>
            <div class="settings-actions"><button type="button" class="btn" id="settings-test-speech">TEST VOICE</button><button type="button" class="btn" id="settings-export">EXPORT ALL DATA</button><button type="button" class="btn btn-dim" id="settings-reset">RESET PROGRESS</button></div>`;

        document.getElementById('setting-pack').addEventListener('change', event => { preferences.pack = event.target.value; applyAlphabet(preferences.pack, preferences.digits); savePreferences(); showToast('Alphabet pack updated'); });
        document.getElementById('setting-digits').addEventListener('change', event => { preferences.digits = event.target.value; applyAlphabet(preferences.pack, preferences.digits); savePreferences(); showToast('Digit pronunciation updated'); });
        document.getElementById('setting-theme').addEventListener('change', event => { preferences.theme = event.target.value; applyVisualPreferences(); savePreferences(); showToast('Theme updated'); });
        document.getElementById('setting-font').addEventListener('change', event => { preferences.font = event.target.value; applyVisualPreferences(); savePreferences(); showToast('Typeface updated'); });
        document.getElementById('setting-rate').addEventListener('input', event => { preferences.ttsRate = Number(event.target.value); document.getElementById('setting-rate-value').textContent = preferences.ttsRate.toFixed(1) + '×'; savePreferences(); });
        document.getElementById('setting-voice').addEventListener('change', event => { preferences.ttsVoice = event.target.value; savePreferences(); });
        document.getElementById('setting-whisper').addEventListener('change', event => { preferences.whisper = event.target.checked; savePreferences(); });
        document.getElementById('settings-test-speech').addEventListener('click', () => speak('Alpha Bravo Charlie', { whisper: preferences.whisper }));
        document.getElementById('settings-export').addEventListener('click', () => { downloadText('nato-trainer-data.json', JSON.stringify({ stats, preferences }, null, 2), 'application/json'); showToast('All trainer data exported'); });
        document.getElementById('settings-reset').addEventListener('click', () => { stats = freshStats(); saveStats(); showToast('Progress reset'); });
    }
    window.addEventListener('alphabetchange', render);
    if ('speechSynthesis' in window && typeof window.speechSynthesis.addEventListener === 'function') window.speechSynthesis.addEventListener('voiceschanged', render);
    render();
})();

window.NATOTrainer = {
    getAlphabet: () => ({ ...NATO }),
    getPacks: () => Object.fromEntries(Object.entries(PACKS).map(([id, pack]) => [id, { label: pack.label, letters: { ...pack.letters } }])),
    setAlphabet: (packId, digitVariant = 'standard') => applyAlphabet(packId, digitVariant, false),
    generateITString,
    masteryEstimate,
    confusionCsv,
    getStats: () => JSON.parse(JSON.stringify(stats))
};

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch(() => announce('Offline cache registration unavailable'));
}
loadStats();
</script>
